<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timemark Studio Pro - V6</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --primary: #f39c12;
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --text-light: #ffffff;
            --text-dim: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh; /* Quan trọng: Đảm bảo body chiếm hết chiều cao để đẩy menu xuống đáy */
            box-sizing: border-box;
        }

        /* KHU VỰC 1: VIEW ẢNH (Nằm trên cùng) */
        #viewArea {
            width: 100%;
            max-width: 600px;
            flex: 1; /* Tự động giãn để đẩy khối Menu bên dưới xuống đáy */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* Khung Camera Web */
        #cameraContainer {
            width: 100%;
            position: relative;
            display: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            max-height: 70vh;
            object-fit: cover;
            background: #000;
            display: block;
        }
        .capture-btn-overlay {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 65px;
            background-color: white;
            border-radius: 50%;
            border: 4px solid var(--primary);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .capture-btn-overlay:active { background-color: #ddd; transform: translateX(-50%) scale(0.95); }
        .close-camera-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px; height: 35px;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }

        /* Khung Canvas (Ảnh đã chụp) */
        canvas { 
            width: 100%; 
            max-height: 65vh; 
            object-fit: contain; 
            border-radius: 12px; 
            display: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* KHU VỰC 2: BẢNG CHỈNH SỬA */
        .editor-workspace { 
            width: 100%; max-width: 600px; display: none; flex-direction: column; gap: 15px; margin-bottom: 20px;
        }
        .tabs { display: flex; background: #2a2a2a; border-radius: 8px; padding: 4px; }
        .tab-btn { flex: 1; background: transparent; color: var(--text-dim); border: none; padding: 10px 5px; font-size: 13px; font-weight: 600; border-radius: 6px; }
        .tab-btn.active { background: var(--bg-panel); color: var(--primary); }
        .tab-content { background: var(--bg-panel); padding: 15px; border-radius: 8px; display: none; }
        .tab-content.active { display: block; }
        
        .control-group { margin-bottom: 15px; }
        .control-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: #ddd; }
        .val-display { color: var(--primary); font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        input[type="range"] { width: 100%; accent-color: var(--primary); }
        
        .download-btn { background-color: #27ae60; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 5px; transition: 0.2s;}

        /* KHU VỰC 3: MENU ĐIỀU KHIỂN (Đẩy xuống đáy) */
        #bottomMenu {
            width: 100%;
            max-width: 600px;
            margin-top: auto; /* Thuộc tính CSS đưa Menu xuống đáy */
            padding-bottom: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0 0 5px 0; font-size: 22px; letter-spacing: 0.5px;}
        .header p { margin: 0; font-size: 13px; color: var(--text-dim); }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn {
            padding: 14px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            text-align: center;
        }
        .btn:active { transform: scale(0.95); }
        input[type="file"] { display: none; }
        
        .btn-orange { background-color: var(--primary); border: none; color: black; }
        .btn-dark { background-color: #2a2a2a; border: 1px solid #444; color: white; }
        .btn-full { grid-column: span 2; }
    </style>
</head>
<body>

    <!-- KHU VỰC VIEW ẢNH -->
    <div id="viewArea">
        <div id="cameraContainer">
            <button class="close-camera-btn" id="closeCameraBtn">✖</button>
            <video id="videoFeed" autoplay playsinline></video>
            <div class="capture-btn-overlay" id="captureBtn"></div>
        </div>
        <canvas id="photoCanvas"></canvas>
    </div>

    <!-- BẢNG CHỈNH SỬA -->
    <div class="editor-workspace" id="editorWorkspace">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-main')">📝 Ngày Giờ</button>
            <button class="tab-btn" onclick="switchTab('tab-logo')">®️ Logo</button>
            <button class="tab-btn" onclick="switchTab('tab-shadow')">🌑 Bóng Đổ</button>
        </div>

        <div id="tab-main" class="tab-content active">
            <div class="control-group">
                <div class="control-header"><label>Ghi chú (Mã TB, text...):</label></div>
                <input type="text" id="customTextInput" placeholder="Nhập văn bản...">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Kích thước cụm</label> <span class="val-display" id="val-sizeMain">11%</span></div>
                <input type="range" id="sizeMain" min="2" max="25" value="11">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Căn lề Ngang (X)</label> <span class="val-display" id="val-posX">4%</span></div>
                <input type="range" id="posX" min="0" max="95" value="4">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Căn lề Dọc (Y)</label> <span class="val-display" id="val-posY">75%</span></div>
                <input type="range" id="posY" min="0" max="95" value="75">
            </div>
        </div>

        <div id="tab-logo" class="tab-content">
            <div class="control-group">
                <div class="control-header"><label>Kích thước Logo</label> <span class="val-display" id="val-sizeLogo">4%</span></div>
                <input type="range" id="sizeLogo" min="2" max="25" value="4">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Căn lề Ngang (X)</label> <span class="val-display" id="val-logoX">77%</span></div>
                <input type="range" id="logoX" min="0" max="95" value="77">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Căn lề Dọc (Y)</label> <span class="val-display" id="val-logoY">92%</span></div>
                <input type="range" id="logoY" min="0" max="95" value="92">
            </div>
        </div>

        <div id="tab-shadow" class="tab-content">
            <div class="control-group">
                <div class="control-header"><label>Độ đậm (Opacity)</label> <span class="val-display" id="val-shadowOpacity">70%</span></div>
                <input type="range" id="shadowOpacity" min="0" max="100" value="70">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Độ nhòe & Tỏa (Blur)</label> <span class="val-display" id="val-shadowSize">4px</span></div>
                <input type="range" id="shadowSize" min="0" max="20" value="4">
            </div>
        </div>

        <button class="download-btn" id="downloadBtn">⬇️ Lưu Ảnh Ngay</button>
    </div>

    <!-- MENU ĐIỀU KHIỂN NẰM DƯỚI ĐÁY -->
    <div id="bottomMenu">
        <div class="header">
            <h2>Timemark Studio</h2>
            <p>Giao diện điều khiển chuyên nghiệp</p>
        </div>
        <div class="action-grid">
            <button class="btn btn-orange" id="startCameraBtn">📸 Cam Web</button>
            <label class="btn btn-dark">
                📱 Cam Gốc
                <input type="file" id="nativeCameraInput" accept="image/*" capture="environment">
            </label>
            <label class="btn btn-dark btn-full">
                🖼️ Thư Viện
                <input type="file" id="galleryInput" accept="image/*">
            </label>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW fail: ', err));
            });
        }
    </script>

    <script>
        const bottomMenu = document.getElementById('bottomMenu');
        const editorWorkspace = document.getElementById('editorWorkspace');
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        const cameraContainer = document.getElementById('cameraContainer');
        const videoFeed = document.getElementById('videoFeed');
        const captureBtn = document.getElementById('captureBtn');
        const startCameraBtn = document.getElementById('startCameraBtn');
        const closeCameraBtn = document.getElementById('closeCameraBtn');
        
        const nativeCameraInput = document.getElementById('nativeCameraInput');
        const galleryInput = document.getElementById('galleryInput');

        let currentStream = null;
        let lastUsedMode = ''; // Biến ghi nhớ tác vụ cuối cùng
        let img = new Image();

        function stopCameraStream() {
            if(currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            cameraContainer.style.display = 'none';
        }

        // HÀM RESET GIAO DIỆN SẠCH (ẨN TẤT CẢ TRỪ MENU)
        function resetToFreshState() {
            stopCameraStream();
            canvas.style.display = 'none';
            editorWorkspace.style.display = 'none';
        }

        // 1. MỞ CAM WEB
        startCameraBtn.addEventListener('click', async () => {
            lastUsedMode = 'webcam';
            resetToFreshState();
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                videoFeed.srcObject = currentStream;
                bottomMenu.style.display = 'none'; // Giấu cụm menu đi khi đang soi cam
                cameraContainer.style.display = 'block';
            } catch (err) {
                alert("Không thể mở Camera. Vui lòng cấp quyền máy ảnh!");
                bottomMenu.style.display = 'block';
            }
        });

        closeCameraBtn.addEventListener('click', () => {
            resetToFreshState();
            bottomMenu.style.display = 'block';
        });

        // 2. BẤM CHỤP TRONG CAM WEB
        captureBtn.addEventListener('click', () => {
            canvas.width = videoFeed.videoWidth;
            canvas.height = videoFeed.videoHeight;
            ctx.drawImage(videoFeed, 0, 0, canvas.width, canvas.height);
            
            img.onload = function() {
                cameraContainer.style.display = 'none';
                canvas.style.display = 'block';
                editorWorkspace.style.display = 'flex';
                drawWatermark();
                canvas.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };
            img.src = canvas.toDataURL('image/jpeg');
            stopCameraStream();
        });

        // 3. XỬ LÝ ẢNH CAM GỐC & THƯ VIỆN
        function handleFileUpload(e, mode) {
            const file = e.target.files[0];
            if (!file) return;
            lastUsedMode = mode; // Ghi nhớ lại (nativecam hoặc library)

            resetToFreshState();
            const reader = new FileReader();
            reader.onload = function(event) {
                img.onload = function() {
                    bottomMenu.style.display = 'none'; // Giấu menu khi bắt đầu chỉnh sửa
                    canvas.style.display = 'block';
                    editorWorkspace.style.display = 'flex';
                    canvas.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    drawWatermark();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
            e.target.value = ''; 
        }

        nativeCameraInput.addEventListener('change', (e) => handleFileUpload(e, 'nativecam'));
        galleryInput.addEventListener('change', (e) => handleFileUpload(e, 'library'));

        // TAB & DRAW WATERMARK
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        const inputs = ['customTextInput', 'sizeMain', 'posX', 'posY', 'sizeLogo', 'logoX', 'logoY', 'shadowOpacity', 'shadowSize'];
        inputs.forEach(id => {
            const inputEl = document.getElementById(id);
            inputEl.addEventListener('input', (e) => {
                const displayEl = document.getElementById(`val-${id}`);
                if(displayEl) displayEl.innerText = id === 'shadowSize' ? `${e.target.value}px` : `${e.target.value}%`;
                drawWatermark();
            });
        });

        function drawWatermark() {
            if (!img.src) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const getVal = (id) => document.getElementById(id).value;
            const sSize = parseInt(getVal('shadowSize'));
            const sOpacity = parseInt(getVal('shadowOpacity')) / 100;
            ctx.shadowColor = `rgba(0, 0, 0, ${sOpacity})`;
            ctx.shadowBlur = sSize;
            ctx.shadowOffsetX = sSize / 1.5;
            ctx.shadowOffsetY = sSize / 1.5;

            const shortEdge = Math.min(canvas.width, canvas.height);
            const baseSize = Math.floor(shortEdge * (getVal('sizeMain') / 100)); 
            const marginX = canvas.width * (getVal('posX') / 100);
            const marginY = canvas.height * (getVal('posY') / 100);

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const dateStr = `${now.getDate()} Tháng ${now.getMonth() + 1}, ${now.getFullYear()}`;
            const daysOfWeek = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            const dayOfWeekStr = daysOfWeek[now.getDay()];

            ctx.font = `bold ${baseSize}px sans-serif`;
            ctx.textBaseline = 'top';
            ctx.fillStyle = 'white';
            ctx.fillText(timeStr, marginX, marginY);
            
            const timeWidth = ctx.measureText(timeStr).width;
            ctx.shadowColor = 'transparent';
            const barX = marginX + timeWidth + (baseSize * 0.2);
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(barX, marginY + (baseSize * 0.1), Math.max(3, baseSize * 0.04), baseSize * 0.8);
            
            ctx.shadowColor = `rgba(0, 0, 0, ${sOpacity})`;
            const dateSize = Math.floor(baseSize * 0.35);
            ctx.font = `${dateSize}px sans-serif`;
            ctx.fillStyle = 'white';
            const dateX = barX + (baseSize * 0.2);
            ctx.fillText(dateStr, dateX, marginY + (baseSize * 0.05));
            ctx.fillText(dayOfWeekStr, dateX, marginY + (baseSize * 0.5));

            const locationStr = "Phú Thọ, P. Hòa Bình";
            const locY = marginY + baseSize + (baseSize * 0.2);
            ctx.fillText(locationStr, marginX, locY);

            const customText = document.getElementById('customTextInput').value.trim();
            if (customText !== "") ctx.fillText(customText, marginX, locY + (baseSize * 0.5));

            const logoBaseSize = Math.floor(shortEdge * (getVal('sizeLogo') / 100)); 
            const lX = canvas.width * (getVal('logoX') / 100);
            const lY = canvas.height * (getVal('logoY') / 100);

            ctx.font = `bold ${logoBaseSize}px sans-serif`;
            ctx.fillStyle = '#FFC107'; 
            ctx.fillText("Time", lX, lY);
            
            const timeLogoWidth = ctx.measureText("Time").width;
            ctx.fillStyle = 'white';
            ctx.fillText("mark", lX + timeLogoWidth, lY);

            const subTextSize = Math.floor(logoBaseSize * 0.65);
            ctx.font = `normal ${subTextSize}px sans-serif`;
            ctx.fillStyle = '#E0E0E0';
            ctx.fillText("100% Chân thực", lX, lY + logoBaseSize + (baseSize * 0.1));
        }

        // 4. LƯU ẢNH VÀ AUTO-RESET
        document.getElementById('downloadBtn').addEventListener('click', function() {
            const btn = this;
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Đang lưu...';

            canvas.toBlob(function(blob) {
                if (!blob) {
                    alert("Có lỗi xảy ra!");
                    btn.innerHTML = originalText;
                    return;
                }
                
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Timemark_Studio_${new Date().getTime()}.jpg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
                
                btn.innerHTML = '✅ Đã lưu vào Thư Viện!';
                btn.style.backgroundColor = '#2980b9'; 
                
                // Sau 1.5 giây, tự động quay lại trạng thái trước đó
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.backgroundColor = ''; 
                    
                    resetToFreshState(); // Xóa ảnh đang chỉnh
                    bottomMenu.style.display = 'block'; // Trả lại Menu

                    // Nếu dùng Cam Web, tự động mở lại Cam Web để chụp tấm tiếp theo
                    if (lastUsedMode === 'webcam') {
                        startCameraBtn.click();
                    }
                    // Nếu là nativecam / library, chỉ cần hiện lại menu là đủ 
                    // (Mobile Web không cho phép tự gọi cửa sổ chọn file bằng code).
                }, 1500); 
                
            }, 'image/jpeg', 0.95); 
        });
    </script>
</body>
</html>
