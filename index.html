<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timemark Studio Pro - V6.3</title>
    <link rel="manifest" href="manifest.json"> 
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --primary: #f39c12;
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --text-light: #ffffff;
            --text-dim: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
            /* THÊM/SỬA 2 DÒNG NÀY Ở DƯỚI CÙNG THẺ BODY */
            min-height: 100dvh; /* Dùng dvh thay cho vh để Safari tự né thanh bar */
            padding-bottom: 40px; /* Nhồi thêm một lớp đệm khí dưới đáy */
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            overscroll-behavior: none; 
        }

        /* KHU VỰC 1: VIEW ẢNH */
        #viewArea {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            
            /* THÊM MỚI: GHIM ẢNH LÊN ĐỈNH MÀN HÌNH */
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: var(--bg-main); 
            padding: 10px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
        }

        #cameraContainer {
            width: 100%;
            position: relative;
            display: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            max-height: 80vh;
            object-fit: cover;
            background: #000;
            display: block;
        }
        .capture-btn-overlay {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 65px;
            background-color: white;
            border-radius: 50%;
            border: 4px solid var(--primary);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .capture-btn-overlay:active { background-color: #ddd; transform: translateX(-50%) scale(0.95); }
        .close-camera-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px; height: 35px;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }

        canvas { 
            width: 100%; 
            max-height: 75dvh; /* Ảnh mặc định phóng to 80% màn hình */
            object-fit: contain; 
            border-radius: 12px; 
            display: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: max-height 0.3s ease-in-out; /* Hiệu ứng thu phóng mượt mà */
        }

        /* Lớp này sẽ được JS tự động thêm vào khi mở bảng thông tin */
        .canvas-shrink {
            max-height: 45dvh !important; /* Ép ảnh thu nhỏ lại còn 45% */
        }

        /* KHU VỰC 2: BẢNG NHẬP THÔNG TIN */
        .editor-workspace { 
            width: 100%; 
            max-width: 600px; 
            display: none; 
            flex-direction: column; 
            gap: 8px; 
            margin-bottom: 20px;
        }
        .input-box {
            background: var(--bg-panel);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .input-box label {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
            display: block;
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #555; 
            background: #111; 
            color: white; 
            box-sizing: border-box; 
            font-size: 15px;
        }

        /* Cài đặt nâng cao (Ẩn mặc định) */
        .control-group { margin-bottom: 15px; }
        .control-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: #ddd; }
        .val-display { color: var(--primary); font-weight: bold; }
        input[type="range"] { width: 100%; accent-color: var(--primary); }

        #toggleSettingsBtn {
            background: transparent; 
            color: var(--primary); 
            border: 1px dashed var(--primary); 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%;
            font-size: 14px;
            transition: 0.2s;
        }
        #toggleSettingsBtn:active { background: #333; }
        .download-btn { background-color: #27ae60; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%; transition: 0.2s;}

        /* KHU VỰC 3: MENU ĐÁY */
        #bottomMenu {
            width: 100%;
            max-width: 600px;
            margin-top: auto;
            padding-bottom: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0 0 5px 0; font-size: 22px; letter-spacing: 0.5px;}
        .header p { margin: 0; font-size: 13px; color: var(--text-dim); }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { padding: 14px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; text-align: center; }
        .btn:active { transform: scale(0.95); }
        input[type="file"] { display: none; }
        .btn-orange { background-color: var(--primary); border: none; color: black; }
        .btn-dark { background-color: #2a2a2a; border: 1px solid #444; color: white; }
        .btn-full { grid-column: span 2; }
    </style>
    <!-- Thư viện tạo mã QR Code siêu nhẹ -->
    <!--<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script> -->

    <script src="./qrious.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
</head>
<body>
    <!-- ========================================== -->
    <!-- MÀN HÌNH CHỜ (DASHBOARD TRANG CHỦ) -->
    <!-- ========================================== -->
    <div id="homeDashboard" style="position: absolute; top: 0; left: 0; width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #2c3e50 0%, #000000 80%); z-index: 5;">
        
        <!-- Logo và Tiêu đề -->
        <!-- ID 'secretTrigger' ĐÃ ĐƯỢC CHUYỂN VÀO LOGO NÀY -->
        <img id="secretTrigger" src="./logo_npt.png" alt="EVNNPT" style="width: 220px; opacity: 1; margin-bottom: 25px;">
        <h2 style="color: #ecf0f1; margin-bottom: 5px; font-family: sans-serif; letter-spacing: 1px; text-transform: uppercase;">GIÁM SÁT HÌNH ẢNH</h2>
        <p style="color: #7f8c8d; font-size: 13px; margin-bottom: 25px;">Hệ thống Xác thực Dữ liệu Hiện trường</p>

        <!-- SLOGAN AN TOÀN -->
        <div style="text-align: center; margin-bottom: 35px; width: 85%; max-width: 350px;">
            <p style="color: #f1c40f; font-size: 16px; font-weight: bold; margin: 0; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); line-height: 1.4;">
                "AN TOÀN ĐỂ LÀM VIỆC <br>
                <span style="color: #e74c3c; font-size: 14px;">AN TOÀN ĐỂ BẠN TRỞ VỀ NHÀ"</span>
            </p>
        </div>

        <!-- Bảng Trạng thái Hệ thống -->
        <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; width: 85%; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            
            <!-- Trạng thái GPS -->
            <div style="display: flex; align-items: center; margin-bottom: 20px;">
                <span style="font-size: 24px; margin-right: 15px;">📡</span>
                <div style="flex-grow: 1;">
                    <div style="color: #bdc3c7; font-size: 12px; text-transform: uppercase;">Tín hiệu Định vị (GPS)</div>
                    <div id="dashGpsStatus" style="color: #f39c12; font-weight: bold; font-size: 15px; margin-top: 3px;">⏳ Đang dò tìm...</div>
                </div>
            </div>

            <!-- Trạng thái Thời gian -->
            <div style="display: flex; align-items: center;">
                <span style="font-size: 24px; margin-right: 15px;">🕒</span>
                <div style="flex-grow: 1;">
                    <div style="color: #bdc3c7; font-size: 12px; text-transform: uppercase;">Đồng bộ Thời gian</div>
                    <div id="dashTimeStatus" style="color: #2ecc71; font-weight: bold; font-size: 15px; margin-top: 3px;">✅ Đã kết nối</div>
                </div>
            </div>
            
        </div>
    </div>
    <!-- VIEW ẢNH -->
    <div id="viewArea">
        <div id="cameraContainer">
            <button class="close-camera-btn" id="closeCameraBtn">✖</button>
            <video id="videoFeed" autoplay playsinline></video>
            <div class="capture-btn-overlay" id="captureBtn"></div>
        </div>
        <canvas id="photoCanvas"></canvas>
    </div>

    <div class="editor-workspace" id="editorWorkspace">
        
        <!-- GỘP 2 NÚT THÀNH 1 HÀNG NGANG (ĐÃ FIX LỖI VIỀN TRÊN IOS) -->
        <div style="display: flex; gap: 8px; width: 100%; align-items: stretch; margin-top: 12px;">
            
            <button id="retakeBtn" style="-webkit-appearance: none; background: transparent; color: #e74c3c; border: 1px dashed #e74c3c; padding: 10px 5px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;">
                🔄 Hủy & Chụp lại
            </button>

            <button id="mainToggleBtn" style="-webkit-appearance: none; background: var(--bg-panel); color: white; border: 1px solid #444; padding: 10px 8px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; flex: 1;">
                <span style="text-align: left; line-height: 1.2;">✏️ Thêm thông tin</span>
                <span id="mainToggleIcon" style="margin-left: 2px;">▼</span>
            </button>
            
        </div>

        <!-- BẢNG ĐIỀU KHIỂN ADMIN: ẨN MẶC ĐỊNH, CHỈ HIỆN KHI NHẬP ĐÚNG PASS -->
        <div id="adminGodModePanel" style="display: none; background: #2c1616; padding: 15px; border-radius: 8px; border: 1px dashed #e74c3c; margin-bottom: 15px;">
            <label style="color: #e74c3c; font-size: 14px; font-weight: bold; display: block; margin-bottom: 10px;">
                ⚡ BẢNG ĐIỀU KHIỂN ADMIN (GOD MODE)
            </label>
            
            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; color: #aaa;">⏳ Ép Giờ & Ngày (Bỏ trống nếu lấy giờ tự động):</label>
                <input type="datetime-local" id="adminTimeInput" style="width: 100%; padding: 10px; background: #111; color: white; border: 1px solid #e74c3c; border-radius: 6px; box-sizing: border-box; margin-top: 5px;">
            </div>

            <div>
                <label style="font-size: 12px; color: #aaa;">📍 Ép Tọa độ GPS (Hoặc lấy từ ảnh gốc):</label>
                <div style="display: flex; gap: 5px; margin-top: 5px;">
                    <input type="text" id="adminGPSInput" placeholder="Nhập tọa độ..." style="width: 100%; padding: 10px; background: #111; color: #f1c40f; border: 1px solid #e74c3c; border-radius: 6px; box-sizing: border-box;">
                    <button id="openMapBtn" style="background: #3498db; color: white; border: none; border-radius: 6px; padding: 0 10px; cursor: pointer; font-weight: bold; white-space: nowrap;">🗺️ Mở Map</button>
                </div>
            </div>
        </div>    
        <!-- TOÀN BỘ KHU VỰC KHOANH ĐỎ ĐƯỢC BỌC VÀO ĐÂY (Mặc định ẩn đi) -->

        <div id="mainEditPanel" style="display: none; margin-bottom: 15px;">
            <div class="input-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label style="margin: 0;">📍 Địa chỉ hiển thị:</label>
                    <button id="getLocationBtn" style="background: transparent; color: var(--primary); border: 1px solid var(--primary); padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.2s;">Tự động lấy vị trí</button>
                </div>
                <input type="text" id="locationInput" value="Phú Thọ, P. Hòa Bình" style="margin-bottom: 15px;">
                <label>🏢 Chọn Trạm / Khu vực:</label>
                <select id="stationSelect" style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #555; background: #111; color: var(--primary); font-size: 15px; margin-bottom: 15px; font-weight: bold; cursor: pointer;">
                    <!-- Javascript sẽ tự động điền tên các trạm vào đây -->
                </select>
                <label>📝 Chọn hoặc Nhập Ghi chú (Mã TB):</label>
                <div style="display: flex; gap: 8px;">
                    <!-- Vùng chứa Input và Nút Mũi tên -->
                    <div style="position: relative; flex: 1;">
                        <input type="text" id="customTextInput" placeholder="Gõ tên TB..." style="width: 100%; padding-right: 35px; box-sizing: border-box; margin-bottom: 0;">
                        <!-- NÚT MŨI TÊN BẠN YÊU CẦU ĐƯỢC CHÈN VÀO ĐÂY -->
                        <button id="dropdownToggleBtn" style="position: absolute; right: 2px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--primary); font-size: 14px; cursor: pointer; height: 90%; width: 30px; display: flex; align-items: center; justify-content: center;">
                            ▼
                        </button>
                        
                        <!-- Danh sách thiết bị (Tự thiết kế, mặc định ẩn) -->
                        <ul id="customDropdownList" style="display: none; position: absolute; top: 100%; left: 0; width: 100%; background: #2a2a2a; border: 1px solid #555; border-radius: 6px; margin: 4px 0 0 0; padding: 0; list-style: none; max-height: 160px; overflow-y: auto; z-index: 999; box-shadow: 0 4px 15px rgba(0,0,0,0.7);">
                        </ul>
                    </div>
                    
                    <button id="saveDeviceBtn" style="background: var(--primary); color: black; border: none; padding: 0 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap;">💾 Lưu TB</button>
                </div>
            </div>

            <button id="toggleSettingsBtn">⚙️ Hiển thị Căn chỉnh Thủ công</button>

            <!-- BẢNG THÔNG SỐ NÂNG CAO (ĐÃ ĐƯỢC CHIA 2 CỘT GỌN GÀNG) -->
            <div id="advancedSettings" style="display: none; background: #2a2a2a; padding: 15px; border-radius: 8px; border: 1px solid #444; max-height: 40vh; overflow-y: auto;">
                
                <!-- Dùng CSS Grid để chia 2 cột -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    
                    <!-- DÒNG 1: Tọa độ Chữ -->
                    <div class="control-group" style="margin-bottom: 0;">
                        <div class="control-header"><label>Lề Ngang (X):</label> <span class="val-display" id="val-posX">4%</span></div>
                        <input type="range" id="posX" min="0" max="95" value="4">
                    </div>
                    <div class="control-group" style="margin-bottom: 0;">
                        <div class="control-header"><label>Lề Dọc (Y):</label> <span class="val-display" id="val-posY">75%</span></div>
                        <input type="range" id="posY" min="0" max="95" value="75">
                    </div>

                    <!-- DÒNG 2: Tọa độ Logo -->
                    <div class="control-group" style="margin-bottom: 0;">
                        <div class="control-header"><label>Logo Ngang:</label> <span class="val-display" id="val-logoX">77%</span></div>
                        <input type="range" id="logoX" min="0" max="95" value="77">
                    </div>
                    <div class="control-group" style="margin-bottom: 0;">
                        <div class="control-header"><label>Logo Dọc:</label> <span class="val-display" id="val-logoY">92%</span></div>
                        <input type="range" id="logoY" min="0" max="95" value="92">
                    </div>

                    <!-- DÒNG 3: Kích thước -->
                    <div class="control-group" style="margin-bottom: 0;">
                        <div class="control-header"><label>Size Chữ:</label> <span class="val-display" id="val-sizeMain">11%</span></div>
                        <input type="range" id="sizeMain" min="2" max="25" value="11">
                    </div>
                    <div class="control-group" style="margin-bottom: 0;">
                        <div class="control-header"><label>Size Logo:</label> <span class="val-display" id="val-sizeLogo">4%</span></div>
                        <input type="range" id="sizeLogo" min="2" max="25" value="4">
                    </div>

                </div>

                <div style="display:none;">
                    <input type="range" id="shadowOpacity" value="70">
                    <input type="range" id="shadowSize" value="4">
                </div>
            </div>
        </div>

        <button class="download-btn" id="downloadBtn">⬇️ Lưu Ảnh</button>
    </div>

    <!-- MENU ĐÁY -->
    <div id="bottomMenu">
        <!-- Đã xóa khối header chứa chữ Timemark Studio và chuyển ổ khóa lên Logo -->
        
        <div class="action-grid">
            <button class="btn btn-orange" id="startCameraBtn">📸 Cam Web</button>
            <label class="btn btn-dark">
                📱 Cam Gốc
                <input type="file" id="nativeCameraInput" accept="image/*" capture="environment">
            </label>
            
            <!-- Đã thêm id 'galleryBtnWrapper' và style='display:none;' để ẩn đi -->
            <label class="btn btn-dark btn-full" id="galleryBtnWrapper" style="display: none;">
                🖼️ Thư Viện
                <input type="file" id="galleryInput" accept="image/*">
            </label>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW fail: ', err));
            });
        }
    </script>

    <script>
        const bottomMenu = document.getElementById('bottomMenu');
        const editorWorkspace = document.getElementById('editorWorkspace');
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        const cameraContainer = document.getElementById('cameraContainer');
        const videoFeed = document.getElementById('videoFeed');
        const captureBtn = document.getElementById('captureBtn');
        const startCameraBtn = document.getElementById('startCameraBtn');
        const closeCameraBtn = document.getElementById('closeCameraBtn');
        
        const nativeCameraInput = document.getElementById('nativeCameraInput');
        const galleryInput = document.getElementById('galleryInput');

            // ==========================================
            // KHỞI ĐỘNG: DASHBOARD TRANG CHỦ & KIỂM TRA GPS
            // ==========================================
// ==========================================
            // KHỞI ĐỘNG: DASHBOARD TRANG CHỦ & KIỂM TRA GPS
            // ==========================================
            window.addEventListener('load', () => {
                const dashGps = document.getElementById('dashGpsStatus');
                
                // 1. Kéo thanh menu chứa 2 nút Cam nổi lên trên cùng màn hình nền đen
                const btmMenu = document.getElementById('bottomMenu');
                if(btmMenu) btmMenu.style.zIndex = '10';

                // 2. Kiểm tra GPS
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            if (dashGps) {
                                const acc = Math.round(position.coords.accuracy);
                                dashGps.innerHTML = `✅ Sẵn sàng (Sai số: ${acc}m)`;
                                dashGps.style.color = "#2ecc71";
                            }
                        },
                        (error) => {
                            if (dashGps) {
                                dashGps.innerHTML = `❌ Hãy bật GPS & Tải lại`;
                                dashGps.style.color = "#e74c3c";
                            }
                            // Bật hộp thoại cảnh báo đanh thép nếu quên bật GPS
                            alert("⚠️ CẢNH BÁO BẢO MẬT:\n\nKhông tìm thấy tín hiệu định vị! Vui lòng vuốt màn hình xuống, BẬT ĐỊNH VỊ (GPS) và TẢI LẠI TRANG để hệ thống hoạt động chính xác.");
                        },
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                } else {
                    if (dashGps) dashGps.innerHTML = "⚠️ Không hỗ trợ GPS";
                }
            });

            // Lệnh ẩn Bảng điều khiển khi nhân viên bấm bắt đầu chụp
            const hideDashboard = () => {
                const dash = document.getElementById('homeDashboard');
                if (dash) dash.style.display = 'none';
            };

            // Gắn lệnh ẩn vào 3 nút chức năng hiện có của bạn
            startCameraBtn.addEventListener('click', hideDashboard);
            nativeCameraInput.addEventListener('change', hideDashboard);
            galleryInput.addEventListener('change', hideDashboard);

        // ==========================================
        // 🔒 TÍNH NĂNG ẨN: KHÓA ADMIN CHO THƯ VIỆN 
        // ==========================================
        const secretTrigger = document.getElementById('secretTrigger');
        const galleryBtnWrapper = document.getElementById('galleryBtnWrapper');
        let tapCount = 0;
        let tapTimer;

        secretTrigger.addEventListener('click', () => {
            tapCount++;
            clearTimeout(tapTimer); // Xóa bộ hẹn giờ cũ
            
            if (tapCount === 5) {
                tapCount = 0; // Reset bộ đếm
                const pwd = prompt("🔒 Chế độ Admin. Nhập mật khẩu:");
                if (pwd === "hchien83") { 
                    galleryBtnWrapper.style.display = 'inline-flex'; // Hiện nút Thư viện
                    
                    // LỆNH MỚI: HIỆN THÊM BẢNG GOD MODE CHO ADMIN
                    const godPanel = document.getElementById('adminGodModePanel');
                    if(godPanel) godPanel.style.display = 'block';
                    
                    alert("✅ Đã mở khóa Quyền Admin Tối Cao!");
                } else if (pwd !== null) {
                    alert("❌ Sai mật khẩu!");
                }
            }

                    }
                    
                    exifr.gps(file).then(gps => {

                                btn.style.background = "#e74c3c"; // Màu đỏ
                                setTimeout(() => { btn.innerText = oldText; btn.style.background = "#3498db"; }, 4000);

            const objectUrl = URL.createObjectURL(file);

            function initStations() {

        // TÁCH HÀM LẤY VỊ TRÍ ĐỂ CÓ THỂ CHẠY TỰ ĐỘNG NHIỀU LẦN
        function fetchLocation(isManual = false) {
            if ("geolocation" in navigator) {
                getLocationBtn.innerText = "⏳ Đang dò GPS...";
                getLocationBtn.style.color = "white";
                
                navigator.geolocation.getCurrentPosition(async function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    // THÊM ĐÚNG 1 DÒNG NÀY ĐỂ LƯU TỌA ĐỘ LÀM BẰNG CHỨNG:
                    window.exactGPS = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                    
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&addressdetails=1&accept-language=vi`);
                        const data = await response.json();
                        
                        if (data && data.address) {
                            const addr = data.address;
                            // Thuật toán bóc tách khắt khe: Bắt buộc tìm Phường/Xã và Tỉnh
                            const ward = addr.suburb || addr.village || addr.quarter || addr.hamlet || "";
                            const province = addr.province || addr.state || addr.city || "";
                            
                            let finalStr = "";
                            if (ward && province) {
                                finalStr = `${ward}, ${province}`; 
                            } else {
                                finalStr = ward || province || "Đã lấy tọa độ GPS";
                            }

                            locationInput.value = finalStr;
                            drawWatermark(); 
                            
                            getLocationBtn.innerText = "✅ Đã định vị";
                            getLocationBtn.style.color = "#27ae60";
                            
                            setTimeout(() => { 
                                getLocationBtn.innerText = "📍 Định vị lại"; 
                                getLocationBtn.style.color = "var(--primary)";
                            }, 3000);
                        }
                    } catch (error) {
                        if (isManual) alert("Không tải được tên đường. Sẽ dùng tọa độ thô.");
                        locationInput.value = `GPS: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                        drawWatermark();
                        getLocationBtn.innerText = "📍 Định vị lại";
                    }
                }, function(error) {
                    if (isManual) {
                        let msg = "⚠️ LỖI ĐỊNH VỊ: ";
                        if (error.code === 1) msg += "Apple đang chặn quyền GPS. Hãy xóa icon ngoài MH chính, xóa lịch sử Safari và thêm lại!";
                        else if (error.code === 2) msg += "Không có tín hiệu GPS (Hãy ra chỗ thoáng hơn).";
                        else if (error.code === 3) msg += "Quá thời gian chờ định vị (Timeout). Hãy thử bấm lại!";
                        else msg += error.message;
                        alert(msg);
                    }
                    getLocationBtn.innerText = "📍 Định vị lại";
                }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }); 
                // (Đã tăng timeout lên 20s để iOS có đủ thời gian dò vệ tinh)
            } else {
                if (isManual) alert("Trình duyệt của điện thoại không hỗ trợ GPS.");
            }
        }

        // TÍNH NĂNG ANTI-FRAUD: ĐỒNG BỘ GIỜ QUỐC TẾ (BẢN VĨNH CỬU)
        // ========================================================
        window.secureTime = { serverTimestamp: null, performanceMark: null, isVerified: false };

        async function syncNetworkTime() {
            try {
                let serverTimeStr;
                try {
                    // Ưu tiên 1: Máy chủ TimeAPI siêu tốc
                    const res1 = await fetch('https://timeapi.io/api/Time/current/zone?timeZone=Asia/Ho_Chi_Minh');
                    if (!res1.ok) throw new Error();
                    const data1 = await res1.json();
                    serverTimeStr = data1.dateTime;
                } catch (e) {
                    // Dự phòng 2: Máy chủ WorldTime
                    const res2 = await fetch('https://worldtimeapi.org/api/timezone/Asia/Ho_Chi_Minh');
                    const data2 = await res2.json();
                    serverTimeStr = data2.datetime;
                }
                
                // Lưu lại mốc giờ chuẩn và thời gian phần cứng
                window.secureTime.serverTimestamp = new Date(serverTimeStr).getTime();
                window.secureTime.performanceMark = performance.now();
                window.secureTime.isVerified = true;
                
                // Hiệu ứng đổi màu nút Cam Web để báo hiệu thành công
                const camBtn = document.getElementById('startCameraBtn');
                if(camBtn) {
                    camBtn.innerHTML = '📸 Cam Web <span style="color:#2ecc71">✔</span>';
                    camBtn.style.borderColor = '#2ecc71';
                }
            } catch (error) {
                // Nếu sập cả 2 máy chủ (Mất mạng)
                window.secureTime.isVerified = false;
                const camBtn = document.getElementById('startCameraBtn');
                if(camBtn) camBtn.innerHTML = '📸 Cam Web ⚠️';
            }
        }

        // Kích hoạt đồng bộ giờ tự động
        window.addEventListener('load', syncNetworkTime);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') syncNetworkTime();
        });
        document.getElementById('startCameraBtn').addEventListener('click', syncNetworkTime);
        document.getElementById('nativeCameraInput').addEventListener('click', syncNetworkTime);
        // ========================================================
        function drawWatermark() {
            if (!img.src) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const getVal = (id) => document.getElementById(id).value;
            const sSize = parseInt(getVal('shadowSize'));
            const sOpacity = parseInt(getVal('shadowOpacity')) / 100;
            ctx.shadowColor = `rgba(0, 0, 0, ${sOpacity})`;
            ctx.shadowBlur = sSize;
            ctx.shadowOffsetX = sSize / 1.5;
            ctx.shadowOffsetY = sSize / 1.5;

            const shortEdge = Math.min(canvas.width, canvas.height);
            const baseSize = Math.floor(shortEdge * (getVal('sizeMain') / 100)); 
            const marginX = canvas.width * (getVal('posX') / 100);
            
            // Đổi const thành let để thuật toán có thể tự động thay đổi vị trí nếu cần
            let marginY = (canvas.height * (getVal('posY') / 100)) - (baseSize * 0.3);

            // ========================================================
            // THUẬT TOÁN CHỐNG TRÀN LỀ DƯỚI (ANTI-OVERFLOW)
            // ========================================================
            // 1. Nhẩm tính tổng chiều cao của khối chữ
            let estimatedHeight = baseSize * 1.2; // Chiều cao cơ bản của dòng Ngày & Giờ
            
            if (locationInput.value.trim() !== "") estimatedHeight += (baseSize * 0.4);
            if (window.exactGPS && window.exactGPS !== "") estimatedHeight += (baseSize * 0.4);
            
            const stationSelectElForHeight = document.getElementById('stationSelect');
            if (stationSelectElForHeight && stationSelectElForHeight.value !== "" && stationSelectElForHeight.value !== "none") {
                estimatedHeight += (baseSize * 0.55);
            }
            
            if (customTextInput.value.trim() !== "") {
                estimatedHeight += (baseSize * 0.6); // Tính thêm không gian cho khung viền xanh của Ghi chú
            }

            // 2. Kích hoạt chống tràn
            const bottomSafeZone = canvas.height * 0.98; // Mốc an toàn cách đáy ảnh 2%
            if (marginY + estimatedHeight > bottomSafeZone) {
                // Nếu bị tràn, tự động đẩy toàn bộ khối chữ lên trên cho vừa khít
                marginY = bottomSafeZone - estimatedHeight;
            }
            // ========================================================

            // --- TỪ ĐOẠN NÀY TRỞ ĐI, CODE CỦA BẠN GIỮ NGUYÊN ---
            // BƯỚC 2A: QUYỀN ADMIN - THAO TÚNG THỜI GIAN & GPS

            // ==========================================
            // BƯỚC 2A: QUYỀN ADMIN - THAO TÚNG THỜI GIAN & GPS
            // ==========================================
            let now;
            let timeStatus = ""; 
            
            // 1. THAO TÚNG THỜI GIAN
            const adminTimeInput = document.getElementById('adminTimeInput');
            if (adminTimeInput && adminTimeInput.value) {
                // Nếu Admin nhập giờ -> Ép hệ thống dùng giờ giả
                now = new Date(adminTimeInput.value);
                timeStatus = " [✔ Chuẩn QT]"; // Làm giả luôn con dấu Quốc tế để che mắt!
            } else if (window.secureTime && window.secureTime.isVerified) {
                // Chế độ bình thường
                const elapsed = performance.now() - window.secureTime.performanceMark;
                now = new Date(window.secureTime.serverTimestamp + elapsed);
                timeStatus = " [✔ Chuẩn QT]"; 
            } else {
                now = new Date(); 
                timeStatus = " [⚠️ Giờ Máy]"; 
            }

            // 2. THAO TÚNG GPS
            const adminGPSInput = document.getElementById('adminGPSInput');
            if (adminGPSInput && adminGPSInput.value.trim() !== "") {
                // Ép luôn biến GPS toàn cầu thành tọa độ của Admin
                window.exactGPS = adminGPSInput.value.trim(); 
            }

            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const dateStr = `${now.getDate()} Tháng ${now.getMonth() + 1}, ${now.getFullYear()}`;
            const daysOfWeek = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            const dayOfWeekStr = daysOfWeek[now.getDay()];

            ctx.font = `bold ${baseSize}px sans-serif`;
            ctx.textBaseline = 'top';
            ctx.fillStyle = 'white';
            ctx.fillText(timeStr, marginX, marginY);
            
            const timeWidth = ctx.measureText(timeStr).width;
            ctx.shadowColor = 'transparent';
            const barX = marginX + timeWidth + (baseSize * 0.2);
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(barX, marginY + (baseSize * 0.1), Math.max(3, baseSize * 0.04), baseSize * 0.8);
            
            ctx.shadowColor = `rgba(0, 0, 0, ${sOpacity})`;
            const dateSize = Math.floor(baseSize * 0.35);
            ctx.font = `${dateSize}px sans-serif`;
            ctx.fillStyle = 'white';
            const dateX = barX + (baseSize * 0.2);
            ctx.fillText(dateStr, dateX, marginY + (baseSize * 0.05));
            ctx.fillText(dayOfWeekStr, dateX, marginY + (baseSize * 0.5));

            // 1. IN ĐỊA CHỈ
            const locationStr = locationInput.value.trim();
            let currentLineY = marginY + baseSize + (baseSize * 0.2); 
            if (locationStr !== "") {
                ctx.fillText(locationStr, marginX, currentLineY);
                currentLineY += (baseSize * 0.4); 
            }

            // 2. IN TỌA ĐỘ GPS
            if (window.exactGPS && window.exactGPS !== "") {
                const gpsSize = Math.floor(baseSize * 0.35); 
                ctx.font = `normal ${gpsSize}px sans-serif`;
                ctx.fillStyle = '#f1c40f'; 
                ctx.fillText(`📍 Tọa độ: ${window.exactGPS}`, marginX, currentLineY);
                currentLineY += (baseSize * 0.4); 
            }

            // 3. IN TÊN TRẠM
            const stationSelectEl = document.getElementById('stationSelect');
            if (stationSelectEl && stationSelectEl.value !== "" && stationSelectEl.value !== "none") {
                const stationSize = Math.floor(baseSize * 0.4); 
                ctx.font = `bold ${stationSize}px sans-serif`;
                ctx.fillStyle = '#3498db'; 
                ctx.fillText(`${stationSelectEl.value}`, marginX, currentLineY);
                // TĂNG KHOẢNG CÁCH: Đổi từ 0.42 xuống 0.55 để kéo dòng Thiết bị xuống 
                currentLineY += (baseSize * 0.55); 
            }

            // 4. IN GHI CHÚ THIẾT BỊ (Highlight ôm sát chữ)
            const customText = customTextInput.value.trim();
            if (customText !== "") {
                const noteSize = Math.floor(baseSize * 0.45);
                ctx.font = `bold ${noteSize}px sans-serif`;
                const fullText = `${customText}`; 
                
                const textWidth = ctx.measureText(fullText).width;
                const padX = baseSize * 0.12; // Giảm lề ngang một chút cho cân đối
                
                // GIẢM CHIỀU CAO HỘP: Ép lề dọc (padY) mỏng lại để ôm sát chữ
                const padY = baseSize * 0.05; // Đổi từ 0.1 xuống 0.05
                
                ctx.shadowColor = 'transparent';
                ctx.fillStyle = '#2ecc71'; 
                
                // Chiều cao hộp được ép lại (chỉ nhân 2.2 thay vì 2.5) để vừa khít dấu tiếng Việt
                ctx.fillRect(marginX - padX, currentLineY - padY, textWidth + (padX * 2), noteSize + (padY * 2.2));
                
                ctx.fillStyle = '#ffffff'; 
                ctx.fillText(fullText, marginX, currentLineY);
            }

            // 5. IN LOGO EVNNPT
            if (evnLogo.complete && evnLogo.width > 0) {
                const logoTargetWidth = baseSize * 3.5; 
                const ratio = evnLogo.height / evnLogo.width;
                const logoTargetHeight = logoTargetWidth * ratio;
                const logoTopX = marginX; 
                const logoTopY = canvas.height * 0.04; 
                
                ctx.shadowColor = 'transparent'; 
                ctx.drawImage(evnLogo, logoTopX, logoTopY, logoTargetWidth, logoTargetHeight);
            }

            // ========================================================
            // 6. IN MÃ QR (CHỐNG GIAN LẬN + CHỐNG LỖI MẤT GPS CỦA PWA IOS)
            // ========================================================
            let mapsUrl = "Chưa cấp quyền GPS hoặc mất tín hiệu";
            if (window.exactGPS && window.exactGPS !== "") {
                const gpsForLink = window.exactGPS.replace(/\s/g, '');
                mapsUrl = `https://maps.google.com/?q=${gpsForLink}`;
            }

            const stationSelectForQR = document.getElementById('stationSelect');
            const stationName = (stationSelectForQR && stationSelectForQR.value !== "none") ? stationSelectForQR.value : "Ảnh thường";
            const deviceName = customTextInput.value.trim() || "Chưa nhập";
            
            const securityPayload = `[BẰNG CHỨNG GỐC]\n- Trạm: ${stationName}\n- TB: ${deviceName}\n- Lúc: ${timeStr} - ${dateStr}${timeStatus}\n- Vị trí: ${mapsUrl}`;
            
            const utf8Payload = unescape(encodeURIComponent(securityPayload));

            const qr = new QRious({
                value: utf8Payload, 
                size: 300, 
                background: 'white',
                foreground: 'black',
                level: 'M'
            });

            const qrSize = baseSize * 1.5; 
            const qrX = canvas.width * (getVal('logoX') / 100);
            const qrY = (canvas.height * (getVal('logoY') / 100)) - qrSize;

            ctx.shadowColor = 'transparent';
            ctx.fillStyle = 'white';
            ctx.fillRect(qrX - 4, qrY - 4, qrSize + 8, qrSize + 8);
            ctx.drawImage(qr.canvas, qrX, qrY, qrSize, qrSize);
            
            const hintSize = Math.floor(baseSize * 0.28);
            ctx.font = `bold ${hintSize}px sans-serif`;
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center'; 
            ctx.fillText("Quét để Xác thực", qrX + (qrSize / 2), qrY + qrSize + (baseSize * 0.35));
            ctx.textAlign = 'left'; 
        }

        // ========================================================
        // HỆ THỐNG TRẠM TRUNG CHUYỂN OFFLINE (SỬ DỤNG INDEXEDDB)
        // ========================================================
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynmSb_cktvwmeeYi8uDbe8RdAueA0FYan0P5ppPAxvA3dDMOylNezp-zUO1P_lcxyb/exec';
        let offlineDB;
        const requestDB = indexedDB.open("NptSmartCamDB", 1);
        
        requestDB.onupgradeneeded = (e) => {
            offlineDB = e.target.result;
            // Tạo một "nhà kho" tên là pendingUploads để chứa ảnh chưa gửi được
            if (!offlineDB.objectStoreNames.contains("pendingUploads")) {
                offlineDB.createObjectStore("pendingUploads", { keyPath: "id" });
            }
        };
        
        requestDB.onsuccess = (e) => {
            offlineDB = e.target.result;
            syncOfflineQueue(); // Vừa mở app lên là kiểm tra kho xem có ảnh tồn không
        };

        // Hàm nhét ảnh vào kho khi mất mạng hoặc mạng lỗi
        function saveToOfflineQueue(payload) {
            if (!offlineDB) return;
            const tx = offlineDB.transaction("pendingUploads", "readwrite");
            tx.objectStore("pendingUploads").put({ id: Date.now(), payload: payload });
            console.log("Đã lưu tạm 1 ảnh vào kho Offline.");
        }

        // Hàm dọn kho (Tự động gửi ảnh đi khi có mạng)
        function syncOfflineQueue() {
            if (!navigator.onLine || !offlineDB) return;
            
            const tx = offlineDB.transaction("pendingUploads", "readonly");
            const store = tx.objectStore("pendingUploads");
            const req = store.getAll();
            
            req.onsuccess = () => {
                const items = req.result;
                if(items.length > 0) console.log(`Phát hiện mạng! Đang đồng bộ ${items.length} ảnh tồn đọng...`);
                
                items.forEach(item => {
                    fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(item.payload)
                    }).then(res => res.text()).then(() => {
                        // Gửi xong thì xóa file đó khỏi kho để giải phóng bộ nhớ điện thoại
                        offlineDB.transaction("pendingUploads", "readwrite").objectStore("pendingUploads").delete(item.id);
                        console.log("Đã đồng bộ bù thành công:", item.payload.fileName);
                    }).catch(err => console.log("Lỗi khi đồng bộ bù:", err));
                });
            };
        }

        // ⚡ LẮNG NGHE SỰ KIỆN: Bất cứ khi nào điện thoại báo có mạng -> Lập tức chạy hàm dọn kho
        window.addEventListener('online', syncOfflineQueue);
        // ========================================================

        document.getElementById('downloadBtn').addEventListener('click', function() {
            const btn = this;
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Đang xử lý...';

            canvas.toBlob(async function(blob) {
                if (!blob) {
                    alert("Có lỗi xảy ra khi xử lý ảnh!");
                    btn.innerHTML = originalText;
                    return;
                }
                
                let stationName = document.getElementById('stationSelect') ? document.getElementById('stationSelect').value : 'Studio';
                if (stationName === "none") stationName = "AnhThuong"; // Tránh bị lỗi tên file
                const fileName = `Timemark_${stationName}_${new Date().getTime()}.jpg`;
                const file = new File([blob], fileName, { type: 'image/jpeg' });

                // ==========================================
                // ĐẨY LÊN DRIVE HOẶC LƯU VÀO KHO OFFLINE
                // ==========================================
                const base64Data = canvas.toDataURL('image/jpeg', 0.95);
                const payloadData = {
                    fileName: fileName,
                    mimeType: 'image/jpeg',
                    base64: base64Data
                };

                let cloudStatusMsg = '✅ Đã lưu Máy & Cloud!';

                if (navigator.onLine) {
                    // Nếu có mạng: Thử gửi luôn
                    fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payloadData)
                    }).then(res => res.text())
                      .then(data => console.log('Đã đẩy thẳng lên Cloud:', data))
                      .catch(err => {
                          // Nếu mạng chập chờn gửi thất bại -> Tự động nhét vào kho Offline
                          console.log('Mạng chập chờn, đẩy vào kho offline:', err);
                          saveToOfflineQueue(payloadData);
                          cloudStatusMsg = '✅ Đã lưu Máy (Chờ mạng để lên Cloud)';
                      });
                } else {
                    // Nếu mất mạng hoàn toàn: Đẩy thẳng vào kho Offline
                    saveToOfflineQueue(payloadData);
                    cloudStatusMsg = '✅ Đã lưu Máy (Chờ mạng để lên Cloud)';
                }
                // ==========================================

                // HÀM RESET GIAO DIỆN 
                const finishAndReset = () => {
                    btn.innerHTML = cloudStatusMsg; // Thông báo động tùy theo tình trạng mạng
                    btn.style.backgroundColor = '#2ecc71'; 
                    
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.style.backgroundColor = ''; 
                        
                        resetToFreshState(); 
                        bottomMenu.style.display = 'block'; 
                        document.getElementById('customTextInput').value = '';

                        if (lastUsedMode === 'webcam') {
                            startCameraBtn.click(); 
                        }
                    }, 1500);
                };

                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

                try {
                    if ((isIOS || isSafari) && navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            files: [file],
                            title: 'Timemark Image'
                        });
                        finishAndReset(); 
                    } else {
                        const url = window.URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = fileName;
                        
                        document.body.appendChild(link);
                        link.click();
                        
                        document.body.removeChild(link);
                        window.URL.revokeObjectURL(url);
                        
                        finishAndReset(); 
                    }
                } catch (error) {
                    btn.innerHTML = originalText;
                }
            }, 'image/jpeg', 0.95); 
        });

        // Nút mở nhanh Google Maps cho Admin đi săn tọa độ
        const openMapBtn = document.getElementById('openMapBtn');
        if (openMapBtn) {
            openMapBtn.addEventListener('click', (e) => {
                e.preventDefault(); // Ngăn nút tải lại trang
                window.open('https://www.google.com/maps', '_blank');
            });
        }

    </script>
</body>
