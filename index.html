<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f39c12">
    <title>Timemark Pro - V5 (In-App Camera)</title>
    <style>
        :root {
            --primary: #f39c12;
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --text-light: #ffffff;
            --text-dim: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h2 { margin: 0 0 5px 0; font-size: 20px; }
        .header p { margin: 0; font-size: 13px; color: var(--text-dim); }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            justify-content: center;
        }
        
        .upload-btn {
            background-color: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 25px; 
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0 !important; 
            flex: 1;
            justify-content: center;
            border: none;
        }
        .gallery-btn {
            background-color: #2c3e50; 
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.3);
        }
        .upload-btn:active { transform: scale(0.95); }
        input[type="file"] { display: none; }

        /* KHU VỰC CAMERA IN-APP */
        #cameraContainer {
            width: 100%;
            max-width: 600px;
            position: relative;
            display: none; /* Ẩn mặc định */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            background: #000;
        }
        video {
            width: 100%;
            max-height: 65vh;
            object-fit: cover;
            display: block;
        }
        .capture-btn-overlay {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 65px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            border: 4px solid #fff;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .capture-btn-overlay::after {
            content: '';
            width: 50px;
            height: 50px;
            background-color: white;
            border-radius: 50%;
            transition: 0.1s;
        }
        .capture-btn-overlay:active::after { transform: scale(0.85); }
        
        #closeCameraBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 16px;
            cursor: pointer;
        }

        /* KHU VỰC HIỂN THỊ ẢNH */
        .canvas-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        canvas {
            width: 100%;
            max-height: 50vh; 
            object-fit: contain; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            background: #000;
        }

        /* KHU VỰC BẢNG ĐIỀU KHIỂN */
        .editor-workspace {
            width: 100%;
            max-width: 600px;
            display: none; 
            flex-direction: column;
            gap: 15px;
        }
        .tabs {
            display: flex;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 4px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            color: var(--text-dim);
            border: none;
            padding: 10px 5px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--bg-panel);
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .tab-content {
            background: var(--bg-panel);
            padding: 15px;
            border-radius: 8px;
            display: none; 
        }
        .tab-content.active { display: block; }
        
        .control-group { margin-bottom: 15px; }
        .control-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: #ddd; }
        .val-display { color: var(--primary); font-weight: bold; }
        
        input[type="text"] {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; font-size: 14px;
        }
        input[type="range"] { width: 100%; accent-color: var(--primary); }

        .download-btn {
            background-color: #27ae60;
            color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; margin-top: 10px;
        }
        .download-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Timemark Studio</h2>
        <p>Giao diện điều khiển chuyên nghiệp</p>
    </div>

    <!-- 2 Nút hành động -->
    <div class="action-buttons">
        <button class="upload-btn" id="startCameraBtn">📸 Chụp Ảnh</button>
        <label class="upload-btn gallery-btn">
            🖼️ Thư Viện
            <input type="file" id="galleryInput" accept="image/*">
        </label>
    </div>

    <!-- KHU VỰC CAMERA IN-APP -->
    <div id="cameraContainer">
        <video id="videoFeed" autoplay playsinline></video>
        <button id="closeCameraBtn">✖</button>
        <div class="capture-btn-overlay" id="captureBtn"></div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="photoCanvas"></canvas>
    </div>

    <div class="editor-workspace" id="editorWorkspace">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-main')">📝 Ngày Giờ</button>
            <button class="tab-btn" onclick="switchTab('tab-logo')">®️ Logo</button>
            <button class="tab-btn" onclick="switchTab('tab-shadow')">🌑 Bóng Đổ</button>
        </div>

        <div id="tab-main" class="tab-content active">
            <div class="control-group">
                <div class="control-header"><label>Ghi chú (Mã TB, text...):</label></div>
                <input type="text" id="customTextInput" placeholder="Nhập văn bản...">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Kích thước cụm</label> <span class="val-display" id="val-sizeMain">8%</span></div>
                <input type="range" id="sizeMain" min="2" max="25" value="8">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Căn lề Ngang (X)</label> <span class="val-display" id="val-posX">4%</span></div>
                <input type="range" id="posX" min="0" max="95" value="4">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Căn lề Dọc (Y)</label> <span class="val-display" id="val-posY">75%</span></div>
                <input type="range" id="posY" min="0" max="95" value="75">
            </div>
        </div>

        <div id="tab-logo" class="tab-content">
            <div class="control-group">
                <div class="control-header"><label>Kích thước Logo</label> <span class="val-display" id="val-sizeLogo">5%</span></div>
                <input type="range" id="sizeLogo" min="2" max="25" value="5">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Căn lề Ngang (X)</label> <span class="val-display" id="val-logoX">75%</span></div>
                <input type="range" id="logoX" min="0" max="95" value="75">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Căn lề Dọc (Y)</label> <span class="val-display" id="val-logoY">92%</span></div>
                <input type="range" id="logoY" min="0" max="95" value="92">
            </div>
        </div>

        <div id="tab-shadow" class="tab-content">
            <div class="control-group">
                <div class="control-header"><label>Độ đậm (Opacity)</label> <span class="val-display" id="val-shadowOpacity">70%</span></div>
                <input type="range" id="shadowOpacity" min="0" max="100" value="70">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Độ nhòe & Tỏa (Blur)</label> <span class="val-display" id="val-shadowSize">4px</span></div>
                <input type="range" id="shadowSize" min="0" max="20" value="4">
            </div>
        </div>

        <button class="download-btn" id="downloadBtn">⬇️ Lưu Ảnh Ngay</button>
    </div>

    <script>
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        const editorWorkspace = document.getElementById('editorWorkspace');
        let img = new Image();

        // --- CAMERA LOGIC ---
        const videoFeed = document.getElementById('videoFeed');
        const cameraContainer = document.getElementById('cameraContainer');
        const startCameraBtn = document.getElementById('startCameraBtn');
        const captureBtn = document.getElementById('captureBtn');
        const closeCameraBtn = document.getElementById('closeCameraBtn');
        let currentStream = null;

        // Hàm tắt Camera
        function stopCamera() {
            if(currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            cameraContainer.style.display = 'none';
        }

        startCameraBtn.addEventListener('click', async () => {
            canvas.style.display = 'none';
            editorWorkspace.style.display = 'none';
            
            try {
                // Ưu tiên camera sau, độ phân giải cao
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                videoFeed.srcObject = currentStream;
                cameraContainer.style.display = 'block';
            } catch (err) {
                alert("Không thể mở Camera. Vui lòng cấp quyền máy ảnh cho trình duyệt!");
            }
        });

        closeCameraBtn.addEventListener('click', stopCamera);

        captureBtn.addEventListener('click', () => {
            // Chụp khung hình từ Video sang Canvas (ẩn)
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = videoFeed.videoWidth;
            tempCanvas.height = videoFeed.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(videoFeed, 0, 0, tempCanvas.width, tempCanvas.height);
            
            // Xử lý nạp ảnh vào biến img giống như khi tải từ Thư viện
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                canvas.style.display = 'block';
                editorWorkspace.style.display = 'flex';
                canvas.scrollIntoView({ behavior: 'smooth', block: 'start' });
                drawWatermark();
            }
            img.src = tempCanvas.toDataURL('image/jpeg', 1.0);
            
            stopCamera();
        });

        // --- GALLERY LOGIC ---
        const galleryInput = document.getElementById('galleryInput');
        galleryInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    stopCamera(); // Tắt camera nếu đang bật
                    canvas.style.display = 'block';
                    editorWorkspace.style.display = 'flex';
                    canvas.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    drawWatermark();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
            e.target.value = ''; // Reset thẻ input
        });

        // --- WATERMARK LOGIC ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        const inputs = ['customTextInput', 'sizeMain', 'posX', 'posY', 'sizeLogo', 'logoX', 'logoY', 'shadowOpacity', 'shadowSize'];
        
        inputs.forEach(id => {
            const inputEl = document.getElementById(id);
            inputEl.addEventListener('input', (e) => {
                const displayEl = document.getElementById(`val-${id}`);
                if(displayEl) displayEl.innerText = id === 'shadowSize' ? `${e.target.value}px` : `${e.target.value}%`;
                drawWatermark();
            });
        });

        function drawWatermark() {
            if (!img.src) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const getVal = (id) => document.getElementById(id).value;

            const sSize = parseInt(getVal('shadowSize'));
            const sOpacity = parseInt(getVal('shadowOpacity')) / 100;
            ctx.shadowColor = `rgba(0, 0, 0, ${sOpacity})`;
            ctx.shadowBlur = sSize;
            ctx.shadowOffsetX = sSize / 1.5;
            ctx.shadowOffsetY = sSize / 1.5;

            const shortEdge = Math.min(canvas.width, canvas.height);
            
            // 1. NGÀY GIỜ
            const baseSize = Math.floor(shortEdge * (getVal('sizeMain') / 100)); 
            const marginX = canvas.width * (getVal('posX') / 100);
            const marginY = canvas.height * (getVal('posY') / 100);

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const dateStr = `${now.getDate()} Tháng ${now.getMonth() + 1}, ${now.getFullYear()}`;
            const daysOfWeek = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            const dayOfWeekStr = daysOfWeek[now.getDay()];

            ctx.font = `bold ${baseSize}px sans-serif`;
            ctx.textBaseline = 'top';
            ctx.fillStyle = 'white';
            ctx.fillText(timeStr, marginX, marginY);
            
            const timeWidth = ctx.measureText(timeStr).width;
            ctx.shadowColor = 'transparent';
            const barX = marginX + timeWidth + (baseSize * 0.2);
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(barX, marginY + (baseSize * 0.1), Math.max(3, baseSize * 0.04), baseSize * 0.8);
            
            ctx.shadowColor = `rgba(0, 0, 0, ${sOpacity})`;
            const dateSize = Math.floor(baseSize * 0.35);
            ctx.font = `${dateSize}px sans-serif`;
            ctx.fillStyle = 'white';
            const dateX = barX + (baseSize * 0.2);
            ctx.fillText(dateStr, dateX, marginY + (baseSize * 0.05));
            ctx.fillText(dayOfWeekStr, dateX, marginY + (baseSize * 0.5));

            const locationStr = "Phú Thọ, P. Hòa Bình";
            const locY = marginY + baseSize + (baseSize * 0.2);
            ctx.fillText(locationStr, marginX, locY);

            const customText = document.getElementById('customTextInput').value.trim();
            if (customText !== "") ctx.fillText(customText, marginX, locY + (baseSize * 0.5));

            // 2. LOGO
            const logoBaseSize = Math.floor(shortEdge * (getVal('sizeLogo') / 100)); 
            const lX = canvas.width * (getVal('logoX') / 100);
            const lY = canvas.height * (getVal('logoY') / 100);

            ctx.font = `bold ${logoBaseSize}px sans-serif`;
            ctx.fillStyle = '#FFC107'; 
            ctx.fillText("Time", lX, lY);
            
            const timeLogoWidth = ctx.measureText("Time").width;
            ctx.fillStyle = 'white';
            ctx.fillText("mark", lX + timeLogoWidth, lY);

            const subTextSize = Math.floor(logoBaseSize * 0.65);
            ctx.font = `normal ${subTextSize}px sans-serif`;
            ctx.fillStyle = '#E0E0E0';
            ctx.fillText("100% Chân thực", lX, lY + logoBaseSize + (baseSize * 0.1));
        }

        document.getElementById('downloadBtn').addEventListener('click', function() {
            const dataURL = canvas.toDataURL('image/jpeg', 0.95);
            const link = document.createElement('a');
            link.download = `Timemark_${new Date().getTime()}.jpg`;
            link.href = dataURL;
            link.click();
        });
    </script>

    <!-- Đăng ký Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW scope: ', reg.scope))
                    .catch(err => console.log('SW fail: ', err));
            });
        }
    </script>
</body>
</html>
