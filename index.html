<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f39c12">
    <title>Timemark Pro - V4 (Pro UI)</title>
    <style>
        :root {
            --primary: #f39c12;
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --text-light: #ffffff;
            --text-dim: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h2 { margin: 0 0 5px 0; font-size: 20px; }
        .header p { margin: 0; font-size: 13px; color: var(--text-dim); }

        /* Nút Upload kiểu mới */
        .upload-btn {
            background-color: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 25px; /* Bo tròn dạng viên thuốc */
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .upload-btn:active { transform: scale(0.95); }
        input[type="file"] { display: none; }

        /* KHU VỰC HIỂN THỊ ẢNH (Quan trọng nhất) */
        .canvas-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        canvas {
            width: 100%;
            /* Giới hạn chiều cao để luôn chứa lọt màn hình, nhường chỗ cho bảng điều khiển */
            max-height: 50vh; 
            object-fit: contain; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            background: #000;
        }

        /* KHU VỰC BẢNG ĐIỀU KHIỂN (Ẩn ban đầu) */
        .editor-workspace {
            width: 100%;
            max-width: 600px;
            display: none; /* Hiện ra khi có ảnh */
            flex-direction: column;
            gap: 15px;
        }

        /* Thanh Tabs Navigation */
        .tabs {
            display: flex;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 4px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            color: var(--text-dim);
            border: none;
            padding: 10px 5px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--bg-panel);
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Nội dung từng Tab */
        .tab-content {
            background: var(--bg-panel);
            padding: 15px;
            border-radius: 8px;
            display: none; /* Ẩn mặc định */
        }
        .tab-content.active {
            display: block; /* Hiện tab đang chọn */
        }

        /* Layout các thanh trượt gọn gàng hơn */
        .control-group {
            margin-bottom: 15px;
        }
        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #ddd;
        }
        .val-display {
            color: var(--primary);
            font-weight: bold;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--primary); /* Đổi màu thanh trượt */
        }

        .download-btn {
            background-color: #27ae60;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-top: 10px;
        }
        .download-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Timemark Studio</h2>
        <p>Giao diện điều khiển chuyên nghiệp</p>
    </div>

    <!-- 2 Nút hành động riêng biệt -->
    <div class="action-buttons">
        <label class="upload-btn">
            📸 Chụp Ảnh
            <!-- Có capture="environment" sẽ mở thẳng Camera -->
            <input type="file" id="cameraInput" accept="image/*" capture="environment">
        </label>
        
        <label class="upload-btn gallery-btn">
            🖼️ Thư Viện
            <!-- Không có capture sẽ mở Bộ sưu tập ảnh -->
            <input type="file" id="galleryInput" accept="image/*">
        </label>
    </div>

    <!-- Kéo Canvas lên trên cùng -->
    <div class="canvas-wrapper">
        <canvas id="photoCanvas"></canvas>
    </div>

    <!-- KHÔNG GIAN LÀM VIỆC (Hiển thị sau khi có ảnh) -->
    <div class="editor-workspace" id="editorWorkspace">
        
        <!-- Thanh Tab -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-main')">📝 Ngày Giờ</button>
            <button class="tab-btn" onclick="switchTab('tab-logo')">®️ Logo</button>
            <button class="tab-btn" onclick="switchTab('tab-shadow')">🌑 Bóng Đổ</button>
        </div>

        <!-- Tab 1: Ngày giờ & Ghi chú -->
        <div id="tab-main" class="tab-content active">
            <div class="control-group">
                <div class="control-header"><label>Ghi chú (Mã TB, text...):</label></div>
                <input type="text" id="customTextInput" placeholder="Nhập văn bản...">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Kích thước cụm</label> <span class="val-display" id="val-sizeMain">8%</span></div>
                <input type="range" id="sizeMain" min="2" max="25" value="8">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Căn lề Ngang (X)</label> <span class="val-display" id="val-posX">4%</span></div>
                <input type="range" id="posX" min="0" max="95" value="4">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Căn lề Dọc (Y)</label> <span class="val-display" id="val-posY">75%</span></div>
                <input type="range" id="posY" min="0" max="95" value="75">
            </div>
        </div>

        <!-- Tab 2: Logo -->
        <div id="tab-logo" class="tab-content">
            <div class="control-group">
                <div class="control-header"><label>Kích thước Logo</label> <span class="val-display" id="val-sizeLogo">5%</span></div>
                <input type="range" id="sizeLogo" min="2" max="25" value="5">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Căn lề Ngang (X)</label> <span class="val-display" id="val-logoX">75%</span></div>
                <input type="range" id="logoX" min="0" max="95" value="75">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Căn lề Dọc (Y)</label> <span class="val-display" id="val-logoY">92%</span></div>
                <input type="range" id="logoY" min="0" max="95" value="92">
            </div>
        </div>

        <!-- Tab 3: Bóng đổ -->
        <div id="tab-shadow" class="tab-content">
            <div class="control-group">
                <div class="control-header"><label>Độ đậm (Opacity)</label> <span class="val-display" id="val-shadowOpacity">70%</span></div>
                <input type="range" id="shadowOpacity" min="0" max="100" value="70">
            </div>
            <div class="control-group">
                <div class="control-header"><label>Độ nhòe & Tỏa (Blur)</label> <span class="val-display" id="val-shadowSize">4px</span></div>
                <input type="range" id="shadowSize" min="0" max="20" value="4">
            </div>
        </div>

        <button class="download-btn" id="downloadBtn">⬇️ Lưu Ảnh Ngay</button>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        const editorWorkspace = document.getElementById('editorWorkspace');
        
        // Quản lý Tabs
        function switchTab(tabId) {
            // Tắt hết active của nút và nội dung
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            // Bật tab được click
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // Danh sách ID các thanh trượt để map sự kiện tự động
        const inputs = ['customTextInput', 'sizeMain', 'posX', 'posY', 'sizeLogo', 'logoX', 'logoY', 'shadowOpacity', 'shadowSize'];
        
        let img = new Image();

        // Gắn sự kiện thay đổi dữ liệu
        inputs.forEach(id => {
            const inputEl = document.getElementById(id);
            inputEl.addEventListener('input', (e) => {
                // Cập nhật text hiển thị số (nếu có span display)
                const displayEl = document.getElementById(`val-${id}`);
                if(displayEl) {
                    displayEl.innerText = id === 'shadowSize' ? `${e.target.value}px` : `${e.target.value}%`;
                }
                drawWatermark(); // Vẽ lại ảnh
            });
        });

        // Xử lý nạp ảnh
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    // Hiện workspace và canvas
                    canvas.style.display = 'block';
                    editorWorkspace.style.display = 'flex';
                    
                    // Tự động cuộn mượt xuống khu vực ảnh
                    canvas.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    
                    drawWatermark();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // Hàm vẽ ảnh và đóng dấu (Giữ nguyên thuật toán tối ưu từ bản trước)
        function drawWatermark() {
            if (!img.src) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const getVal = (id) => document.getElementById(id).value;

            // Bóng đổ
            const sSize = parseInt(getVal('shadowSize'));
            const sOpacity = parseInt(getVal('shadowOpacity')) / 100;
            ctx.shadowColor = `rgba(0, 0, 0, ${sOpacity})`;
            ctx.shadowBlur = sSize;
            ctx.shadowOffsetX = sSize / 1.5;
            ctx.shadowOffsetY = sSize / 1.5;

            const shortEdge = Math.min(canvas.width, canvas.height);
            
            // --- 1. CỤM NGÀY GIỜ ---
            const baseSize = Math.floor(shortEdge * (getVal('sizeMain') / 100)); 
            const marginX = canvas.width * (getVal('posX') / 100);
            const marginY = canvas.height * (getVal('posY') / 100);

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const dateStr = `${now.getDate()} Tháng ${now.getMonth() + 1}, ${now.getFullYear()}`;
            const daysOfWeek = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            const dayOfWeekStr = daysOfWeek[now.getDay()];

            ctx.font = `bold ${baseSize}px sans-serif`;
            ctx.textBaseline = 'top';
            ctx.fillStyle = 'white';
            ctx.fillText(timeStr, marginX, marginY);
            
            const timeWidth = ctx.measureText(timeStr).width;
            ctx.shadowColor = 'transparent';
            const barX = marginX + timeWidth + (baseSize * 0.2);
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(barX, marginY + (baseSize * 0.1), Math.max(3, baseSize * 0.04), baseSize * 0.8);
            
            ctx.shadowColor = `rgba(0, 0, 0, ${sOpacity})`;
            const dateSize = Math.floor(baseSize * 0.35);
            ctx.font = `${dateSize}px sans-serif`;
            ctx.fillStyle = 'white';
            const dateX = barX + (baseSize * 0.2);
            ctx.fillText(dateStr, dateX, marginY + (baseSize * 0.05));
            ctx.fillText(dayOfWeekStr, dateX, marginY + (baseSize * 0.5));

            const locationStr = "Phú Thọ, P. Hòa Bình";
            const locY = marginY + baseSize + (baseSize * 0.2);
            ctx.fillText(locationStr, marginX, locY);

            const customText = document.getElementById('customTextInput').value.trim();
            if (customText !== "") ctx.fillText(customText, marginX, locY + (baseSize * 0.5));

            // --- 2. LOGO ---
            const logoBaseSize = Math.floor(shortEdge * (getVal('sizeLogo') / 100)); 
            const lX = canvas.width * (getVal('logoX') / 100);
            const lY = canvas.height * (getVal('logoY') / 100);

            ctx.font = `bold ${logoBaseSize}px sans-serif`;
            ctx.fillStyle = '#FFC107'; 
            ctx.fillText("Time", lX, lY);
            
            const timeLogoWidth = ctx.measureText("Time").width;
            ctx.fillStyle = 'white';
            ctx.fillText("mark", lX + timeLogoWidth, lY);

            const subTextSize = Math.floor(logoBaseSize * 0.65);
            ctx.font = `normal ${subTextSize}px sans-serif`;
            ctx.fillStyle = '#E0E0E0';
            ctx.fillText("100% Chân thực", lX, lY + logoBaseSize + (baseSize * 0.1));
        }

        // Tải ảnh
        document.getElementById('downloadBtn').addEventListener('click', function() {
            const dataURL = canvas.toDataURL('image/jpeg', 0.95);
            const link = document.createElement('a');
            link.download = `Timemark_Studio_${new Date().getTime()}.jpg`;
            link.href = dataURL;
            link.click();
        });
    </script>

<!-- Đăng ký Service Worker cho chế độ Offline -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('Service Worker đã đăng ký thành công với scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('Đăng ký Service Worker thất bại: ', error);
                    });
            });
        }
    </script>
</body>
</html>

</body>
</html>
