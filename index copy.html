<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timemark</title>
    <link rel="manifest" href="manifest.json"> 
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --primary: #f39c12;
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --text-light: #ffffff;
            --text-dim: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
            /* THÊM/SỬA 2 DÒNG NÀY Ở DƯỚI CÙNG THẺ BODY */
            min-height: 100dvh; /* Dùng dvh thay cho vh để Safari tự né thanh bar */
            padding-bottom: 40px; /* Nhồi thêm một lớp đệm khí dưới đáy */
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            overscroll-behavior: none; 
        }

        /* KHU VỰC 1: VIEW ẢNH */
        #viewArea {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            
            /* THÊM MỚI: GHIM ẢNH LÊN ĐỈNH MÀN HÌNH */
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: var(--bg-main); 
            padding: 10px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
        }

        #cameraContainer {
            width: 100%;
            position: relative;
            display: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            max-height: 80vh;
            object-fit: cover;
            background: #000;
            display: block;
        }
        .capture-btn-overlay {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 65px;
            background-color: white;
            border-radius: 50%;
            border: 4px solid var(--primary);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .capture-btn-overlay:active { background-color: #ddd; transform: translateX(-50%) scale(0.95); }
        .close-camera-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px; height: 35px;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }

        canvas { 
            width: 100%; 
            max-height: 75dvh; /* Ảnh mặc định phóng to 80% màn hình */
            object-fit: contain; 
            border-radius: 12px; 
            display: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: max-height 0.3s ease-in-out; /* Hiệu ứng thu phóng mượt mà */
        }

        /* Lớp này sẽ được JS tự động thêm vào khi mở bảng thông tin */
        .canvas-shrink {
            max-height: 45dvh !important; /* Ép ảnh thu nhỏ lại còn 45% */
        }

        /* KHU VỰC 2: BẢNG NHẬP THÔNG TIN */
        .editor-workspace { 
            width: 100%; 
            max-width: 600px; 
            display: none; 
            flex-direction: column; 
            gap: 8px; 
            margin-bottom: 20px;
        }
        .input-box {
            background: var(--bg-panel);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .input-box label {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
            display: block;
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #555; 
            background: #111; 
            color: white; 
            box-sizing: border-box; 
            font-size: 15px;
        }

        /* Cài đặt nâng cao (Ẩn mặc định) */
        .control-group { margin-bottom: 15px; }
        .control-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: #ddd; }
        .val-display { color: var(--primary); font-weight: bold; }
        input[type="range"] { width: 100%; accent-color: var(--primary); }

        #toggleSettingsBtn {
            background: transparent; 
            color: var(--primary); 
            border: 1px dashed var(--primary); 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%;
            font-size: 14px;
            transition: 0.2s;
        }
        #toggleSettingsBtn:active { background: #333; }
        .download-btn { background-color: #27ae60; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%; transition: 0.2s;}

        /* KHU VỰC 3: MENU ĐÁY */
        #bottomMenu {
            width: 100%;
            max-width: 600px;
            margin-top: auto;
            padding-bottom: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0 0 5px 0; font-size: 22px; letter-spacing: 0.5px;}
        .header p { margin: 0; font-size: 13px; color: var(--text-dim); }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { padding: 14px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; text-align: center; }
        .btn:active { transform: scale(0.95); }
        input[type="file"] { display: none; }
        .btn-orange { background-color: var(--primary); border: none; color: black; }
        .btn-dark { background-color: #2a2a2a; border: 1px solid #444; color: white; }
        .btn-full { grid-column: span 2; }
    </style>

<body>
    <!-- ========================================== -->
    <!-- MÀN HÌNH CHỜ (DASHBOARD TRANG CHỦ) -->
    <!-- ========================================== -->
    <div id="homeDashboard" style="position: absolute; top: 0; left: 0; width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #2c3e50 0%, #000000 80%); z-index: 5;">
        
        <!-- Logo và Tiêu đề -->
        <!-- ID 'secretTrigger' ĐÃ ĐƯỢC CHUYỂN VÀO LOGO NÀY -->
        <img id="secretTrigger" src="./logo_npt.png" alt="EVNNPT" style="width: 220px; opacity: 1; margin-bottom: 25px;">
        <h2 style="color: #ecf0f1; margin-bottom: 5px; font-family: sans-serif; letter-spacing: 1px; text-transform: uppercase;">GIÁM SÁT HÌNH ẢNH</h2>
        <p style="color: #7f8c8d; font-size: 13px; margin-bottom: 25px;">Hệ thống Xác thực Dữ liệu Hiện trường</p>

        <!-- SLOGAN AN TOÀN -->
        <div style="text-align: center; margin-bottom: 35px; width: 85%; max-width: 350px;">
            <p style="color: #f1c40f; font-size: 16px; font-weight: bold; margin: 0; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); line-height: 1.4;">
                "AN TOÀN ĐỂ LÀM VIỆC <br>
                <span style="color: #e74c3c; font-size: 14px;">AN TOÀN ĐỂ BẠN TRỞ VỀ NHÀ"</span>
            </p>
        </div>

        <!-- Bảng Trạng thái Hệ thống -->
        <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; width: 85%; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            
            <!-- Trạng thái GPS -->
            <div style="display: flex; align-items: center; margin-bottom: 20px;">
                <span style="font-size: 24px; margin-right: 15px;">📡</span>
                <div style="flex-grow: 1;">
                    <div style="color: #bdc3c7; font-size: 12px; text-transform: uppercase;">Tín hiệu Định vị (GPS)</div>
                    <div id="dashGpsStatus" style="color: #f39c12; font-weight: bold; font-size: 15px; margin-top: 3px;">⏳ Đang dò tìm...</div>
                </div>
            </div>

            <!-- Trạng thái Thời gian -->
            <div style="display: flex; align-items: center;">
                <span style="font-size: 24px; margin-right: 15px;">🕒</span>
                <div style="flex-grow: 1;">
                    <div style="color: #bdc3c7; font-size: 12px; text-transform: uppercase;">Đồng bộ Thời gian</div>
                    <div id="dashTimeStatus" style="color: #2ecc71; font-weight: bold; font-size: 15px; margin-top: 3px;">✅ Đã kết nối</div>
                </div>
            </div>
            
        </div>
    </div>
    <!-- VIEW ẢNH -->
    <div id="viewArea">
        <div id="cameraContainer">
            <button class="close-camera-btn" id="closeCameraBtn">✖</button>
            <video id="videoFeed" autoplay playsinline></video>
            <div class="capture-btn-overlay" id="captureBtn"></div>
        </div>
        <canvas id="photoCanvas"></canvas>
    </div>

    <div class="editor-workspace" id="editorWorkspace">
        
        <!-- GỘP 2 NÚT THÀNH 1 HÀNG NGANG (ĐÃ FIX LỖI VIỀN TRÊN IOS) -->
        <div style="display: flex; gap: 8px; width: 100%; align-items: stretch; margin-top: 12px;">
            
            <button id="retakeBtn" style="-webkit-appearance: none; background: transparent; color: #e74c3c; border: 1px dashed #e74c3c; padding: 10px 5px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;">
                🔄 Hủy & Chụp lại
            </button>

            <button id="mainToggleBtn" style="-webkit-appearance: none; background: var(--bg-panel); color: white; border: 1px solid #444; padding: 10px 8px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; flex: 1;">
                <span style="text-align: left; line-height: 1.2;">✏️ Thêm thông tin</span>
                <span id="mainToggleIcon" style="margin-left: 2px;">▼</span>
            </button>
            
        </div>

        <!-- BẢNG ĐIỀU KHIỂN ADMIN: ẨN MẶC ĐỊNH, CHỈ HIỆN KHI NHẬP ĐÚNG PASS -->
        <div id="adminGodModePanel" style="display: none; background: #2c1616; padding: 15px; border-radius: 8px; border: 1px dashed #e74c3c; margin-bottom: 15px;">
            <label style="color: #e74c3c; font-size: 14px; font-weight: bold; display: block; margin-bottom: 10px;">
                ⚡ BẢNG ĐIỀU KHIỂN ADMIN (GOD MODE)
            </label>
            
            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; color: #aaa;">⏳ Ép Giờ & Ngày (Bỏ trống nếu lấy giờ tự động):</label>
                <input type="datetime-local" id="adminTimeInput" style="width: 100%; padding: 10px; background: #111; color: white; border: 1px solid #e74c3c; border-radius: 6px; box-sizing: border-box; margin-top: 5px;">
            </div>

            <div>
                <label style="font-size: 12px; color: #aaa;">📍 Ép Tọa độ GPS (Hoặc lấy từ ảnh gốc):</label>
                <div style="display: flex; gap: 5px; margin-top: 5px;">
                    <input type="text" id="adminGPSInput" placeholder="Nhập tọa độ..." style="width: 100%; padding: 10px; background: #111; color: #f1c40f; border: 1px solid #e74c3c; border-radius: 6px; box-sizing: border-box;">
                    <button id="openMapBtn" style="background: #3498db; color: white; border: none; border-radius: 6px; padding: 0 10px; cursor: pointer; font-weight: bold; white-space: nowrap;">🗺️ Mở Map</button>
                </div>
            </div>
        </div>    
        <!-- TOÀN BỘ KHU VỰC KHOANH ĐỎ ĐƯỢC BỌC VÀO ĐÂY (Mặc định ẩn đi) -->

        <div id="mainEditPanel" style="display: none; margin-bottom: 15px;">
            <div class="input-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label style="margin: 0;">📍 Địa chỉ hiển thị:</label>
                    <button id="getLocationBtn" style="background: transparent; color: var(--primary); border: 1px solid var(--primary); padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.2s;">Tự động lấy vị trí</button>
                </div>
                <input type="text" id="locationInput" value="Phú Thọ, P. Hòa Bình" style="margin-bottom: 15px;">
                <label>🏢 Chọn Trạm / Khu vực:</label>
                <select id="stationSelect" style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #555; background: #111; color: var(--primary); font-size: 15px; margin-bottom: 15px; font-weight: bold; cursor: pointer;">
                    <!-- Javascript sẽ tự động điền tên các trạm vào đây -->
                </select>
                <label>📝 Chọn hoặc Nhập Ghi chú (Mã TB):</label>
                <div style="display: flex; gap: 8px;">
                    <!-- Vùng chứa Input và Nút Mũi tên -->
                    <div style="position: relative; flex: 1;">
                        <input type="text" id="customTextInput" placeholder="Gõ tên TB..." style="width: 100%; padding-right: 35px; box-sizing: border-box; margin-bottom: 0;">
                        <!-- NÚT MŨI TÊN BẠN YÊU CẦU ĐƯỢC CHÈN VÀO ĐÂY -->
                        <button id="dropdownToggleBtn" style="position: absolute; right: 2px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--primary); font-size: 14px; cursor: pointer; height: 90%; width: 30px; display: flex; align-items: center; justify-content: center;">
                            ▼
                        </button>
                        
                        <!-- Danh sách thiết bị (Tự thiết kế, mặc định ẩn) -->
                        <ul id="customDropdownList" style="display: none; position: absolute; top: 100%; left: 0; width: 100%; background: #2a2a2a; border: 1px solid #555; border-radius: 6px; margin: 4px 0 0 0; padding: 0; list-style: none; max-height: 160px; overflow-y: auto; z-index: 999; box-shadow: 0 4px 15px rgba(0,0,0,0.7);">
                        </ul>
                    </div>
                    
                    <button id="saveDeviceBtn" style="background: var(--primary); color: black; border: none; padding: 0 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap;">💾 Lưu TB</button>
                </div>
            </div>

            <button id="toggleSettingsBtn">⚙️ Hiển thị Căn chỉnh Thủ công</button>

            <!-- BẢNG THÔNG SỐ NÂNG CAO (ĐÃ ĐƯỢC CHIA 2 CỘT GỌN GÀNG) -->
            <div id="advancedSettings" style="display: none; background: #2a2a2a; padding: 15px; border-radius: 8px; border: 1px solid #444; max-height: 40vh; overflow-y: auto;">
                
                <!-- Dùng CSS Grid để chia 2 cột -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    
                    <!-- DÒNG 1: Tọa độ Chữ -->
                    <div class="control-group" style="margin-bottom: 0;">
                        <div class="control-header"><label>Lề Ngang (X):</label> <span class="val-display" id="val-posX">4%</span></div>
                        <input type="range" id="posX" min="0" max="95" value="4">
                    </div>
                    <div class="control-group" style="margin-bottom: 0;">
                        <div class="control-header"><label>Lề Dọc (Y):</label> <span class="val-display" id="val-posY">75%</span></div>
                        <input type="range" id="posY" min="0" max="95" value="75">
                    </div>

                    <!-- DÒNG 2: Tọa độ Logo -->
                    <div class="control-group" style="margin-bottom: 0;">
                        <div class="control-header"><label>Logo Ngang:</label> <span class="val-display" id="val-logoX">77%</span></div>
                        <input type="range" id="logoX" min="0" max="95" value="77">
                    </div>
                    <div class="control-group" style="margin-bottom: 0;">
                        <div class="control-header"><label>Logo Dọc:</label> <span class="val-display" id="val-logoY">92%</span></div>
                        <input type="range" id="logoY" min="0" max="95" value="92">
                    </div>

                    <!-- DÒNG 3: Kích thước -->
                    <div class="control-group" style="margin-bottom: 0;">
                        <div class="control-header"><label>Size Chữ:</label> <span class="val-display" id="val-sizeMain">11%</span></div>
                        <input type="range" id="sizeMain" min="2" max="25" value="11">
                    </div>
                    <div class="control-group" style="margin-bottom: 0;">
                        <div class="control-header"><label>Size Logo:</label> <span class="val-display" id="val-sizeLogo">4%</span></div>
                        <input type="range" id="sizeLogo" min="2" max="25" value="4">
                    </div>

                </div>

                <div style="display:none;">
                    <input type="range" id="shadowOpacity" value="70">
                    <input type="range" id="shadowSize" value="4">
                </div>
            </div>
        </div>

        <button class="download-btn" id="downloadBtn">⬇️ Lưu Ảnh</button>
    </div>

    <!-- MENU ĐÁY -->
    <div id="bottomMenu">
        <!-- Đã xóa khối header chứa chữ Timemark Studio và chuyển ổ khóa lên Logo -->
        
        <div class="action-grid">
            <button class="btn btn-orange" id="startCameraBtn">📸 Cam Web</button>
            <label class="btn btn-dark">
                📱 Cam Gốc
                <input type="file" id="nativeCameraInput" accept="image/*" capture="environment">
            </label>
            
            <!-- Đã thêm id 'galleryBtnWrapper' và style='display:none;' để ẩn đi -->
            <label class="btn btn-dark btn-full" id="galleryBtnWrapper" style="display: none;">
                🖼️ Thư Viện
                <input type="file" id="galleryInput" accept="image/*">
            </label>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW fail: ', err));
            });
        }
    </script>
